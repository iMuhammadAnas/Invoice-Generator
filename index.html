<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Generator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #45a049;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
    .total-row {
      font-weight: bold;
      background-color: #f2f2f2;
    }
    .action-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    #invoicePreview {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #ddd;
      background-color: white;
    }
    .invoice-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .invoice-title {
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }
    .invoice-details {
      text-align: right;
    }
    .client-info, .company-info {
      margin-bottom: 20px;
    }
    .print-only {
      display: none;
    }
    .file-input {
      display: none;
    }
    .file-label {
      display: inline-block;
      padding: 6px 12px;
      background-color: #e9e9e9;
      border-radius: 4px;
      cursor: pointer;
    }
    .file-name {
      margin-left: 10px;
      font-style: italic;
    }
    @media print {
      .no-print {
        display: none;
      }
      .print-only {
        display: block;
      }
      body {
        background-color: white;
        padding: 0;
      }
      .container {
        box-shadow: none;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="no-print">Invoice Generator</h1>

    <div class="no-print">
      <div class="form-group">
        <label for="companyName">Your Company Name</label>
        <input type="text" id="companyName" placeholder="Enter your company name">
      </div>

      <div class="form-group">
        <label for="clientName">Client Name</label>
        <input type="text" id="clientName" placeholder="Enter client name">
      </div>

      <div class="form-group">
        <label for="invoiceNumber">Invoice Number</label>
        <input type="text" id="invoiceNumber" placeholder="Enter invoice number">
      </div>

      <div class="form-group">
        <label for="invoiceDate">Invoice Month</label>
        <input type="month" id="invoiceDate">
      </div>

      <h3>Items</h3>
      <table id="itemsTable">
        <thead>
          <tr>
            <th>File</th>
            <th>Price</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>

      <button id="addItemBtn">Add Item</button>


      <div class="action-buttons">
        <button id="generateBtn">Generate Invoice</button>
        <button id="printBtn" disabled>Print Invoice</button>
        <button id="clearBtn">Clear All</button>
      </div>
    </div>

    <div id="invoicePreview">
      <div class="invoice-header">
        <div class="company-info">
          <h2 id="previewCompanyName">Your Company Name</h2>
        </div>
        <div class="invoice-details">
          <div class="invoice-title">INVOICE</div>
          <p>Invoice #: <span id="previewInvoiceNumber">INV-001</span></p>
          <p>Date: <span id="previewInvoiceDate">May 2025</span></p>
        </div>
      </div>

      <div class="client-info">
        <h3>Bill To:</h3>
        <p id="previewClientName">Client Name</p>
      </div>

      <table id="previewItemsTable">
        <thead>
          <tr>
            <th>File</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody id="previewItemsBody"></tbody>
        <tfoot>
          <tr class="total-row">
            <td>Total:</td>
            <td id="total">0</td>
          </tr>
        </tfoot>
      </table>

      <div class="print-only">
        <p> <span id="generatedDate"></span></p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let itemCount = 0;

      const STORAGE_KEY = 'invoiceGeneratorData';

      const itemsBody = document.getElementById('itemsBody');
      const previewItemsBody = document.getElementById('previewItemsBody');
      const addItemBtn = document.getElementById('addItemBtn');
      const generateBtn = document.getElementById('generateBtn');
      const printBtn = document.getElementById('printBtn');
      const clearBtn = document.getElementById('clearBtn');

      const companyNameInput = document.getElementById('companyName');
      const clientNameInput = document.getElementById('clientName');
      const invoiceNumberInput = document.getElementById('invoiceNumber');
      const invoiceDateInput = document.getElementById('invoiceDate');

      function removeExtension(filename) {
        return filename.replace(/\.[^/.]+$/, "");
      }

      function formatNumber(num) {
        return num % 1 === 0 ? num.toString() : num.toFixed(2);
      }

      const today = new Date().toISOString().slice(0, 7);

      function getItemRowsData() {
        const items = [];

        for (let i = 1; i <= itemCount; i++) {
          const row = document.getElementById(`itemRow-${i}`);

          if (!row) continue;

          const fileInput = document.getElementById(`itemFile-${i}`);
          const priceInput = document.getElementById(`itemPrice-${i}`);
          const fileNameElement = document.getElementById(`fileName-${i}`);

          let fileName = fileNameElement?.textContent || 'No file chosen';

          // If a file is currently selected, use its actual name.
          if (fileInput?.files?.[0]) {
            fileName = removeExtension(fileInput.files[0].name);
          }

          items.push({
            fileName: fileName,
            price: priceInput ? priceInput.value : '0'
          });
        }

        return items;
      }

      function saveToLocalStorage() {
        const data = {
          companyName: companyNameInput.value,
          clientName: clientNameInput.value,
          invoiceNumber: invoiceNumberInput.value,
          invoiceDate: invoiceDateInput.value,
          items: getItemRowsData()
        };

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (error) {
          console.error('Could not save invoice data:', error);
        }
      }

      function loadFromLocalStorage() {
        try {
          const savedData = localStorage.getItem(STORAGE_KEY);

          if (!savedData) {
            invoiceDateInput.value = today;
            return;
          }

          const data = JSON.parse(savedData);

          companyNameInput.value = data.companyName || '';
          clientNameInput.value = data.clientName || '';
          invoiceNumberInput.value = data.invoiceNumber || '';
          invoiceDateInput.value = data.invoiceDate || today;

          itemsBody.innerHTML = '';
          itemCount = 0;

          if (Array.isArray(data.items) && data.items.length > 0) {
            data.items.forEach(function (item) {
              addItemRow(item.fileName || 'No file chosen', item.price || '0', false);
            });
          } else {
            addItemRow();
          }

          calculateTotal();
        } catch (error) {
          console.error('Could not load saved invoice data:', error);

          invoiceDateInput.value = today;
          itemsBody.innerHTML = '';
          itemCount = 0;
          addItemRow();
        }
      }

      function addItemRow(savedFileName = 'No file chosen', savedPrice = '0', shouldSave = true) {
        itemCount++;

        const currentId = itemCount;

        const row = document.createElement('tr');
        row.id = `itemRow-${currentId}`;

        row.innerHTML = `
          <td>
            <input type="file" id="itemFile-${currentId}" class="file-input" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.png">
            <label for="itemFile-${currentId}" class="file-label">Choose File</label>
            <span class="file-name" id="fileName-${currentId}">${escapeHtml(savedFileName)}</span>
          </td>
          <td>
            <input type="number" id="itemPrice-${currentId}" placeholder="Price" min="0" step="1" value="${escapeHtml(savedPrice)}">
          </td>
          <td>
            <button type="button" onclick="removeItem(${currentId})">Remove</button>
          </td>
        `;

        itemsBody.appendChild(row);

        const fileInput = document.getElementById(`itemFile-${currentId}`);
        const priceInput = document.getElementById(`itemPrice-${currentId}`);

        fileInput.addEventListener('change', function (e) {
          const fileName = e.target.files[0]
            ? removeExtension(e.target.files[0].name)
            : 'No file chosen';

          document.getElementById(`fileName-${currentId}`).textContent = fileName;

          calculateTotal();
          saveToLocalStorage();
        });

        priceInput.addEventListener('input', function () {
          calculateTotal();
          saveToLocalStorage();
        });

        if (shouldSave) {
          saveToLocalStorage();
        }
      }

      function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = String(value ?? '');
        return div.innerHTML;
      }

      window.removeItem = function (id) {
        const row = document.getElementById(`itemRow-${id}`);

        if (row) {
          row.remove();
          calculateTotal();
          saveToLocalStorage();
        }
      };

      function calculateTotal() {
        let total = 0;

        previewItemsBody.innerHTML = '';

        for (let i = 1; i <= itemCount; i++) {
          const row = document.getElementById(`itemRow-${i}`);

          if (!row) continue;

          const fileInput = document.getElementById(`itemFile-${i}`);
          const fileNameElement = document.getElementById(`fileName-${i}`);
          const priceInput = document.getElementById(`itemPrice-${i}`);

          let fileName = fileNameElement?.textContent || 'File';

          if (fileInput?.files?.[0]) {
            fileName = removeExtension(fileInput.files[0].name);
          }

          const price = parseFloat(priceInput?.value) || 0;

          total += price;

          const previewRow = document.createElement('tr');

          const fileCell = document.createElement('td');
          fileCell.textContent = fileName;

          const priceCell = document.createElement('td');
          priceCell.textContent = formatNumber(price);

          previewRow.appendChild(fileCell);
          previewRow.appendChild(priceCell);

          previewItemsBody.appendChild(previewRow);
        }

        document.getElementById('total').textContent = formatNumber(total);

        return total > 0;
      }

      function generateInvoice() {
        document.getElementById('previewCompanyName').textContent =
          companyNameInput.value || 'Your Company Name';

        document.getElementById('previewClientName').textContent =
          clientNameInput.value || 'Client Name';

        document.getElementById('previewInvoiceNumber').textContent =
          invoiceNumberInput.value || 'INV-001';

        const rawDate = invoiceDateInput.value;

        const [year, month] = rawDate
          ? rawDate.split('-')
          : today.split('-');

        const formattedDate = new Date(`${year}-${month}-01`)
          .toLocaleString('default', {
            month: 'long',
            year: 'numeric'
          });

        document.getElementById('previewInvoiceDate').textContent = formattedDate;

        const hasItems = calculateTotal();

        printBtn.disabled = !hasItems;

        saveToLocalStorage();

        document.getElementById('invoicePreview').scrollIntoView({
          behavior: 'smooth'
        });
      }

      function clearAll() {
        const confirmed = confirm(
          'Are you sure you want to clear all invoice data? This will also remove the saved data from this browser.'
        );

        if (!confirmed) return;

        companyNameInput.value = '';
        clientNameInput.value = '';
        invoiceNumberInput.value = '';
        invoiceDateInput.value = today;

        itemsBody.innerHTML = '';
        previewItemsBody.innerHTML = '';

        itemCount = 0;

        document.getElementById('previewCompanyName').textContent = 'Your Company Name';
        document.getElementById('previewClientName').textContent = 'Client Name';
        document.getElementById('previewInvoiceNumber').textContent = 'INV-001';
        document.getElementById('previewInvoiceDate').textContent =
          new Date(`${today}-01`).toLocaleString('default', {
            month: 'long',
            year: 'numeric'
          });

        document.getElementById('total').textContent = '0';

        printBtn.disabled = true;

        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (error) {
          console.error('Could not clear local storage:', error);
        }

        addItemRow();
      }

      function printInvoice() {
        window.print();
      }

      // Automatically save normal input fields whenever they change.
      [companyNameInput, clientNameInput, invoiceNumberInput, invoiceDateInput]
        .forEach(function (input) {
          input.addEventListener('input', saveToLocalStorage);
          input.addEventListener('change', saveToLocalStorage);
        });

      addItemBtn.addEventListener('click', function () {
        addItemRow();
      });

      generateBtn.addEventListener('click', generateInvoice);
      printBtn.addEventListener('click', printInvoice);
      clearBtn.addEventListener('click', clearAll);

      // Restore saved data when the page loads.
      loadFromLocalStorage();
    });
  </script>
</body>
</html>
